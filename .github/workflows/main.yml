name: Build Free APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'OpenBikeControl/bikecontrol'
          ref: 'v4.1.1+53'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: 'stable'
      - name: Build APK
        run: |
          sed -i 's/gradle-8.10.2-all.zip/gradle-8.14-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          keytool -genkey -v -keystore android/app/upload-keystore.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android, OU=Android, O=Android, L=Android, S=Android, C=US"
          printf "storePassword=android\nkeyPassword=android\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n" > android/keystore.properties
          flutter pub get
          flutter pub global activate intl_utils
          flutter pub global run intl_utils:generate || true
          flutter build apk --debug --android-skip-build-dependency-validation
      - uses: actions/upload-artifact@v4
        with:
          name: BikeControl-4.1.1-Free
          path: build/app/outputs/flutter-apk/app-debug.apk
